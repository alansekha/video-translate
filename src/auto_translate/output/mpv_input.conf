# Key bindings for the auto-translate mpv window (mpv's defaults are disabled).
# Only actions that are safe on a delayed live stream: no seeking, no track switching
# (both break playback because the incoming stream can't seek).
# Jumps (VOD only) are handled by auto-translate itself: it restarts the stream at the new spot.
LEFT            script-message auto-translate-jump -30
RIGHT           script-message auto-translate-jump 30
Shift+LEFT      script-message auto-translate-jump -300
Shift+RIGHT     script-message auto-translate-jump 300
SPACE           cycle pause
p               cycle pause
m               cycle mute
UP              add volume 5
DOWN            add volume -5
WHEEL_UP        add volume 5
WHEEL_DOWN      add volume -5
9               add volume -5
0               add volume 5
f               cycle fullscreen
MBTN_LEFT_DBL   cycle fullscreen
ESC             set fullscreen no
q               quit
Q               quit
CLOSE_WIN       quit
